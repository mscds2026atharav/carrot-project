<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Marg ERP Web</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-header">
            <h2>Billing & Inventory Management System</h2>
        </div>

        <div id="errorAlert" class="alert alert-danger" style="display: none;"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-control" 
                    placeholder="Enter username" 
                    required 
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control" 
                    placeholder="Enter password" 
                    required
                >
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary btn-block">
                Login to System
            </button>
        </form>

        <div class="login-footer">
            <small>Default Logins: Admin (<code>admin</code>) | Cashier (<code>cashier</code>)</small>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');
            const loginBtn = document.getElementById('loginBtn');

            errorAlert.style.display = 'none';
            errorAlert.textContent = '';
            loginBtn.disabled = true;
            loginBtn.textContent = 'Authenticating...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: usernameInput,
                        password: passwordInput
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Store active user session info in localStorage
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    // Redirect to POS screen upon successful login
                    window.location.href = '/pos';
                } else {
                    errorAlert.textContent = data.error || 'Invalid credentials. Please try again.';
                    errorAlert.style.display = 'block';
                }
            } catch (err) {
                errorAlert.textContent = 'Unable to connect to server. Ensure backend is running.';
                errorAlert.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login to System';
            }
        });
    </script>
</body>
</html>
